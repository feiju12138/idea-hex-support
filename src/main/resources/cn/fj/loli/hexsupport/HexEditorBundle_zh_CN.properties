# Hex Support 插件 - 简体中文资源包

# IntelliJ 插件描述会根据当前 IDE 语言自动读取此键。
plugin.cn.fj.loli.hexsupport.description=<p>在 IntelliJ IDEA 中以十六进制方式打开、编辑、比较和检查文件。</p><p>提供可编辑的十六进制字节表、由可选格式 Provider 插件扩展的二进制结构宿主，以及 Diff 窗口中的双栏和 Unified Hex 查看器。</p>

